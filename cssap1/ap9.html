<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .produs {
        background-color: antiquewhite;
        border: 2px solid gray;
        width: 220px;
        height: 400px;
        padding: 10px;
        box-sizing: border-box;
      }
      #imagine {
        width: 100%;
        height: auto;
        display: block;
        margin-bottom: 15px;
        border-radius: 4px;
      }
      #pret {
        font-style: italic;
        color: red;
        margin: 0 0 10px 0;
        font-size: 20px;
      }
      #text {
        color: brown;
        font-size: 16px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="produs">
      <img id="imagine" src="photo/1.jpg" alt="candle" />
      <p id="pret"><strong>50 LEI</strong></p>
      <p id="text">Lumanare turnata manula cu aroma de vanilie</p>
    </div>
  </body>
</html>
