<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Border Style Example</title>
    <style>
      p {
        border-top: 4px solid red;
        border-right: 2px dashed green;
        border-bottom: 6px dotted blue;
        border-left: 3px double black;
        padding: 20px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <p>This is a paragraph with a solid border.</p>
  </body>
</html>
