<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .content {
        color: blue;
      }
      .sub-content {
        font-style: italic;
      }
      .highlight {
        background-color: green;
      }
      #main-title {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1 id="main-title">Welcome to My Page</h1>

    <div class="content">
      <p class="intro">Introduction paragraph.</p>
      <p>Another paragraph in content div.</p>

      <div class="sub-content">
        <h2>Subsection</h2>
        <p>Paragraph inside sub-content.</p>
      </div>
    </div>

    <p>Paragraph outside content div.</p>
    <ul>
      <li class="highlight">First item</li>
      <li>Second item</li>
    </ul>
  </body>
</html>
